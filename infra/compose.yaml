services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: moon_letter
      POSTGRES_USER: moon_letter
      POSTGRES_PASSWORD: moon_letter_dev_only
    ports:
      - "5432:5432"
    volumes:
      # postgres:18 images expect a single mount at /var/lib/postgresql so
      # PGDATA lives in a versioned subdirectory (pg_upgrade friendly).
      - moon-letter-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moon_letter -d moon_letter"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: moon_letter
      MINIO_ROOT_PASSWORD: moon_letter_dev_only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - moon-letter-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  moon-letter-postgres:
  moon-letter-minio:

