services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: moon_letter
      POSTGRES_USER: moon_letter
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/aliyun/.env}"
    volumes:
      - moon-letter-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moon_letter -d moon_letter"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    image: eclipse-temurin:21-jre
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./moon-letter-server.jar:/app/moon-letter-server.jar:ro
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JDBC_DATABASE_URL: jdbc:postgresql://postgres:5432/moon_letter
      JDBC_DATABASE_USERNAME: moon_letter
      JDBC_DATABASE_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/aliyun/.env}"
      BOOTSTRAP_SECRET: "${BOOTSTRAP_SECRET:?Set BOOTSTRAP_SECRET in infra/aliyun/.env}"
      MOON_LETTER_STORAGE_MODE: s3
      S3_ENDPOINT: "${S3_ENDPOINT:?Set S3_ENDPOINT in infra/aliyun/.env}"
      S3_REGION: "${S3_REGION:?Set S3_REGION in infra/aliyun/.env}"
      S3_BUCKET: "${S3_BUCKET:?Set S3_BUCKET in infra/aliyun/.env}"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in infra/aliyun/.env}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:?Set S3_SECRET_KEY in infra/aliyun/.env}"
      S3_PATH_STYLE_ACCESS: "${S3_PATH_STYLE_ACCESS:-false}"
    command: ["java", "-jar", "/app/moon-letter-server.jar", "--server.address=0.0.0.0", "--server.port=8080"]
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - moon-letter-caddy-data:/data
      - moon-letter-caddy-config:/config

volumes:
  moon-letter-postgres:
  moon-letter-caddy-data:
  moon-letter-caddy-config:
